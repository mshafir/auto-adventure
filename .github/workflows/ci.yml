name: ci

# The same gate `prepublishOnly` runs, but on every push, and — the part that
# matters — from `npm ci` rather than a `node_modules` that has been accumulating
# for months. A package present locally but absent from `package.json` resolves
# fine on a developer's machine and cannot resolve here, which is a failure worth
# discovering on a branch rather than halfway through a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Proves the published tarball still carries the content directories the
      # installed game reads — `paths.ts` resolves them next to the module, so a
      # `files` entry lost in a refactor breaks `npx` and nothing else.
      - name: Tarball carries its content
        run: |
          npm pack --silent --pack-destination /tmp >/dev/null
          list="$(tar tzf /tmp/auto-adventure-*.tgz)"
          for path in package/dist/main.js package/.scenarios package/.packs package/assets/ui/title.txt; do
            echo "$list" | grep -q "^$path" || { echo "missing from tarball: $path" >&2; exit 1; }
          done
