<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="585" viewBox="0 0 1032 585" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<title>How a game introduces itself</title>
<rect width="1032" height="585" fill="#14110d"/>
<g shape-rendering="crispEdges"></g>
<g xml:space="preserve"><text x="12.00" y="24.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">╔══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╗</text><text x="12.00" y="41.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  The Long Weather                                                                                                    ║</text><text x="12.00" y="58.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  the late years of a long decline                                                                                    ║</text><text x="12.00" y="75.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="92.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  ─ WHERE YOU ARE ──────────────────────────────────────────────────────────                                          ║</text><text x="12.00" y="109.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  The old roads still run between the holdfasts, though fewer people walk                                             ║</text><text x="12.00" y="126.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  them each year. Something in the weather has turned, and the villages have                                          ║</text><text x="12.00" y="143.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  begun keeping their own counsel. You are in Harrowmere. The country here                                            ║</text><text x="12.00" y="160.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  is old forest.                                                                                                      ║</text><text x="12.00" y="177.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="194.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  ─ WHO YOU ARE ────────────────────────────────────────────────────────────                                          ║</text><text x="12.00" y="211.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  You are a timber-tallier walking the road out of season.                                                            ║</text><text x="12.00" y="228.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="245.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  ─ WHAT BROUGHT YOU HERE ──────────────────────────────────────────────────                                          ║</text><text x="12.00" y="262.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  You are looking for a sibling who stopped writing.                                                                  ║</text><text x="12.00" y="279.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="296.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  ─ WHERE TO START ─────────────────────────────────────────────────────────                                          ║</text><text x="12.00" y="313.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  Bracken Cross lies to the west, a fair walk. Ask for Ilse Marrow. Open                                              ║</text><text x="12.00" y="330.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  errands are marked on the map with a bearing.                                                                       ║</text><text x="12.00" y="347.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="364.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="381.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="398.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="415.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="432.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="449.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="466.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="483.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="500.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="517.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║                                                                                                                      ║</text><text x="12.00" y="534.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">║  SPACE to begin                                                                                                      ║</text><text x="12.00" y="551.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">╚══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╝</text><text x="12.00" y="568.92" textLength="92.40" lengthAdjust="spacingAndGlyphs">Space go on</text></g>
</svg>