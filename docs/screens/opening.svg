<svg xmlns="http://www.w3.org/2000/svg" width="680" height="568" viewBox="0 0 680 568" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<title>How a game introduces itself</title>
<rect width="680" height="568" fill="#14110d"/>
<g shape-rendering="crispEdges"></g>
<g xml:space="preserve"><text x="12.00" y="24.92" textLength="168.00" lengthAdjust="spacingAndGlyphs">    The Long Weather</text><text x="12.00" y="41.92" textLength="302.40" lengthAdjust="spacingAndGlyphs">    the late years of a long decline</text><text x="12.00" y="75.92" textLength="655.20" lengthAdjust="spacingAndGlyphs">    ─ WHERE YOU ARE ──────────────────────────────────────────────────────────</text><text x="12.00" y="92.92" textLength="630.00" lengthAdjust="spacingAndGlyphs">    The old roads still run between the holdfasts, though fewer people walk</text><text x="12.00" y="109.92" textLength="655.20" lengthAdjust="spacingAndGlyphs">    them each year. Something in the weather has turned, and the villages have</text><text x="12.00" y="126.92" textLength="638.40" lengthAdjust="spacingAndGlyphs">    begun keeping their own counsel. You are in Harrowmere. The country here</text><text x="12.00" y="143.92" textLength="151.20" lengthAdjust="spacingAndGlyphs">    is old forest.</text><text x="12.00" y="177.92" textLength="655.20" lengthAdjust="spacingAndGlyphs">    ─ WHO YOU ARE ────────────────────────────────────────────────────────────</text><text x="12.00" y="194.92" textLength="504.00" lengthAdjust="spacingAndGlyphs">    You are a timber-tallier walking the road out of season.</text><text x="12.00" y="228.92" textLength="655.20" lengthAdjust="spacingAndGlyphs">    ─ WHAT BROUGHT YOU HERE ──────────────────────────────────────────────────</text><text x="12.00" y="245.92" textLength="453.60" lengthAdjust="spacingAndGlyphs">    You are looking for a sibling who stopped writing.</text><text x="12.00" y="534.92" textLength="151.20" lengthAdjust="spacingAndGlyphs">    SPACE to begin</text><text x="12.00" y="551.92" textLength="92.40" lengthAdjust="spacingAndGlyphs">Space go on</text></g>
</svg>