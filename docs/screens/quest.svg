<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="585" viewBox="0 0 1032 585" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<title>The story so far, and the errand in hand</title>
<rect width="1032" height="585" fill="#14110d"/>
<g shape-rendering="crispEdges"></g>
<g xml:space="preserve"><text x="12.00" y="24.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓</text><text x="12.00" y="41.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  Carrying   Errands   Journal   Key                                                                                  ┃</text><text x="12.00" y="58.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  ─ THE HOLLOW TITHE — THE STORY SO FAR ────────────────────────────────────────────────────────────────────────────  ┃</text><text x="12.00" y="75.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  Your sister took the warden's badge, walked the road east, and stopped writing.                                     ┃</text><text x="12.00" y="92.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  [x] Take the tally to Stonewait                                                                                     ┃</text><text x="12.00" y="109.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  [~] Timber for the mill                                                                                             ┃</text><text x="12.00" y="126.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃      …and 1 more to come                                                                                             ┃</text><text x="12.00" y="143.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  ─ CLUES ──────────────────────────────────────────────────────────────────────────────────────────────────────────  ┃</text><text x="12.00" y="160.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  • Ilse Marrow says a warden came through in autumn with a new badge and would not give a name, and that the Cord    ┃</text><text x="12.00" y="177.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃    House tally has been short by about a cord every month since the levy doubled.                                    ┃</text><text x="12.00" y="194.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  • Warden Cull confirms it: the badge was signed out in autumn and never signed back in. Two tallies leave the       ┃</text><text x="12.00" y="211.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃    weighing station and only one of them is true.                                                                    ┃</text><text x="12.00" y="228.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  ─ ERRANDS 1 ──────────────────────────────────────────────────────────────────────────────────────────────────────  ┃</text><text x="12.00" y="245.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  ▸ Timber for the mill  0/2                                                                                          ┃</text><text x="12.00" y="262.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  ─ TIMBER FOR THE MILL ────────────────────────────────────────────────────────────────────────────────────────────  ┃</text><text x="12.00" y="279.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  given in                                                                                           SW 2 chunks off  ┃</text><text x="12.00" y="296.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  The miller wants three lengths of sawn timber, and will not take the ones that came off the barge because they      ┃</text><text x="12.00" y="313.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  have been in the water since the narrows.                                                                           ┃</text><text x="12.00" y="330.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  [ ] carry 3 Timber                                                                                                  ┃</text><text x="12.00" y="347.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃  [ ] speak to Sedge                                                                                                  ┃</text><text x="12.00" y="364.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="381.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="398.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="415.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="432.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="449.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="466.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="483.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="500.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="517.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="534.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┃                                                                                                                      ┃</text><text x="12.00" y="551.92" textLength="1008.00" lengthAdjust="spacingAndGlyphs">┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛</text><text x="12.00" y="568.92" textLength="352.80" lengthAdjust="spacingAndGlyphs">Lt/Rt tab  ·  Dn go in  ·  Esc back to map</text></g>
</svg>